[project]
name = "credit-mlops"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "AHuaman", email = "30458204+AHuaman@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mlflow-skinny>=3.18.0,<4",
    "numpy>=2.5.5,<3",
    "pandas>=3.1.1,<4",
    "pyarrow>=26.0.1,<27",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.3,<3",
    "scikit-learn>=1.9.1,<2",
    "typer>=0.29.1,<1",
    "xgboost>=3.4.1,<4",
]

[project.scripts]
credit-mlops = "credit_mlops.cli:app"

[project.optional-dependencies]
train = [
    "dvc>=3.67.1,<4",
    "great-expectations>=1.25.0,<2",
    "matplotlib>=3.11.2,<4",
    "mlflow>=3.18.0,<4",
    "prefect>=3.9.3,<4",
]
api = [
    "fastapi>=0.150.0,<1",
    "uvicorn>=0.54.0,<1",
]
databricks = [
    "databricks-sdk>=0.167.0,<1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "ipykernel>=7.4.0,<8",
    "nbclient>=0.11.0,<1",
    "nbformat>=5.11.1,<6",
    "notebook>=7.6.5,<8",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.5,<1",
    "shap>=0.54.1,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["slow: end-to-end and lab tests (minutes)"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
filterwarnings = [
    # MLflow 3.18 internals, not our code: SQLAlchemy mapper config and pandas 4 preview.
    "ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
    "ignore:Hint. Inferred schema contains integer column:UserWarning",
    "ignore:Operation with range is deprecated:pandas.errors.Pandas4Warning",
]
